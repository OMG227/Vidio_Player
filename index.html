<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Putar Video dari URL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  :root{
    --bg:#f2f0e8; --ink:#111111; --panel:#ffffff;
    --accent:#ff3b1f; --accent2:#0033ff; --line:#111111;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Space Mono', ui-monospace, monospace;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 16px 32px;
  }
  h1{
    font-size:clamp(1.6rem,6vw,2.4rem); font-weight:700; line-height:0.95;
    margin:0 0 6px; text-transform:uppercase; letter-spacing:-0.5px;
  }
  p.sub{
    color:var(--ink); font-size:.85rem; margin:0 0 28px;
    border-left:4px solid var(--accent2); padding-left:10px;
    max-width:520px;
  }
  .card{
    width:100%; max-width:720px; background:var(--panel);
    border:3px solid var(--line); padding:22px;
    box-shadow:8px 8px 0 var(--line);
  }
  form{ display:flex; gap:0; }
  input[type=text]{
    flex:1; background:var(--bg); border:3px solid var(--line);
    border-right:none;
    color:var(--ink); padding:14px; font-size:.95rem; outline:none;
    font-family:inherit;
  }
  input[type=text]:focus{ background:#fff; }
  button{
    background:var(--accent); color:#fff; border:3px solid var(--line);
    padding:14px 20px; font-weight:700; text-transform:uppercase;
    cursor:pointer; font-size:.9rem; font-family:inherit;
    letter-spacing:.5px;
  }
  button:hover{ background:var(--ink); }
  button:active{ transform:translate(3px,3px); }
  .player-wrap{
    margin-top:20px; border:3px solid var(--line); overflow:hidden;
    background:#000; aspect-ratio:16/9; display:none;
    position:relative;
  }
  .player-wrap.active{ display:block; }
  .player-wrap video, .player-wrap iframe{
    width:100%; height:100%; border:0; display:block;
  }
  .msg{
    margin-top:16px; font-size:.8rem; min-height:1.2em;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .msg.error{ color:var(--accent); font-weight:700; }
  .msg.ok{ color:var(--accent2); font-weight:700; }
  footer{
    margin-top:36px; font-size:.8rem; text-align:center;
    border-top:3px solid var(--line); padding-top:14px;
    width:100%; max-width:720px;
  }
  footer a{
    color:var(--ink); text-decoration:none; border-bottom:2px solid var(--accent2);
  }
  footer a:hover{ background:var(--accent2); color:#fff; }
</style>
</head>
<body>
  <h1>Putar Video dari URL</h1>
  <p class="sub">Tempel link YouTube, Vimeo, atau link file video langsung (.mp4/.webm/.ogg)</p>

  <div class="card">
    <form id="form">
      <input type="text" id="urlInput" placeholder="https://..." autocomplete="off">
      <button type="submit">Putar</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="player-wrap" id="playerWrap"></div>
  </div>

  <footer>
    Made by <a href="https://github.com/username" target="_blank" rel="noopener">github.com/username</a>
  </footer>

<script>
const form = document.getElementById('form');
const input = document.getElementById('urlInput');
const msg = document.getElementById('msg');
const wrap = document.getElementById('playerWrap');

function setMsg(text, type){
  msg.textContent = text || '';
  msg.className = 'msg' + (type ? ' ' + type : '');
}

function getYouTubeId(url){
  const patterns = [
    /youtu\.be\/([^?&#]+)/,
    /youtube\.com\/watch\?v=([^?&#]+)/,
    /youtube\.com\/embed\/([^?&#]+)/,
    /youtube\.com\/shorts\/([^?&#]+)/
  ];
  for (const p of patterns){
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

function getVimeoId(url){
  const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}

function isDirectVideo(url){
  return /\.(mp4|webm|ogg|ogv|mov)(\?.*)?$/i.test(url);
}

function render(url){
  wrap.innerHTML = '';
  const yt = getYouTubeId(url);
  const vimeo = getVimeoId(url);

  if (yt){
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + yt;
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
    iframe.allowFullscreen = true;
    wrap.appendChild(iframe);
    setMsg('Memutar video YouTube', 'ok');
  } else if (vimeo){
    const iframe = document.createElement('iframe');
    iframe.src = 'https://player.vimeo.com/video/' + vimeo;
    iframe.allow = 'autoplay; fullscreen; picture-in-picture';
    iframe.allowFullscreen = true;
    wrap.appendChild(iframe);
    setMsg('Memutar video Vimeo', 'ok');
  } else if (isDirectVideo(url)){
    const video = document.createElement('video');
    video.src = url;
    video.controls = true;
    video.autoplay = true;
    wrap.appendChild(video);
    setMsg('Memutar file video langsung', 'ok');
  } else {
    wrap.classList.remove('active');
    setMsg('URL tidak dikenali. Gunakan link YouTube, Vimeo, atau file .mp4/.webm/.ogg', 'error');
    return;
  }
  wrap.classList.add('active');
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const url = input.value.trim();
  if (!url){
    setMsg('Masukkan URL video terlebih dahulu', 'error');
    return;
  }
  render(url);
});
</script>
</body>
</html>
